name: Simple workflow
run-name: 'Deploying to the environment: ${{ inputs.environment }} from branch ${{ github.ref_name }}'
on:
  # push:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        options:
          - dev-we
          - dev-us
        default: dev-we
        type: choice   
env:
  # we can declare envs from inputs at the workflow level, but not based of secrets.
  # NOTE: This technique of assigning inputs and secrets to env is to avoid interpolation,
  # which avoids script injection bugs. Make inputs and secrets env variables.
  ENVIRONMENT: ${{ inputs.environment }}
jobs:
  build:
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    env:
      # We can use secrets at steps level and also like here at the jobs level.
      SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
    steps:
      - name: first step
        run: |
          echo "first line"
          echo "second line"
      - name: environment print
        run: echo "$ENVIRONMENT"
      - name: using secret
        run: |
          echo "sample line"
          echo "$SECRET_PASSWORD"
          echo "We can't print secret, but we can print its length: ${#SECRET_PASSWORD}"
