name: Simple workflow
on:
  # push:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        options:
          - dev-we
          - dev-us
        default: dev-we
        type: choice    
jobs:
  build:
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    steps:
      - name: first step
        run: |
          echo "first line"
          echo "second line"
      - name: environment print
        run: echo ${{ inputs.environment }}
      - name: using secret
        env:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        run: |
          - echo "sample line"
          - echo "${{ env.SECRET_PASSWORD }}"
