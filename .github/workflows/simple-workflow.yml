name: Simple workflow
on:
  # push:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        options:
          - dev-we
          - dev-us
        default: dev-we
        type: choice    
jobs:
  build:
    runs-on: ubuntu-slim
    environment: ${{ inputs.environment }}
    steps:
      - name: first step
        run: |
          echo "first line"
          echo "second line"
      - name: environment print
        # NOTE: This technique to avoid interpolation which avoids script injection bugs. Make inputs and secrets env variables.
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "$ENVIRONMENT"
      - name: using secret
        env:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        run: |
          echo "sample line"
          echo "$SECRET_PASSWORD"
          echo "We can't print secret, but we can print its length: ${#SECRET_PASSWORD}"
